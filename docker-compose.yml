services:
  postgres:
    image: postgres:15-alpine
    container_name: raizes_db
    environment:
      POSTGRES_DB: ${DB_NAME:-raizes_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: